[project]
name = "brookie"
version = "1.0.0"
description = "E-commerce de cookies e brownies artesanais — Brookiê."
authors = [{ name = "Arthur Lanznaster" }]
requires-python = "==3.12.*"
license = { text = "MIT" }

dependencies = [
  "dj-database-url==2.1.0",
  "django==5.2.6",
  "django-cors-headers==4.7.0",
  "django-extensions==3.2.3",
  "django-filter==25.1",
  "djangorestframework==3.16.1",
  "djangorestframework-simplejwt==5.5.1",
  "drf-spectacular==0.29.0",
  "gunicorn==23.0.0",
  "Pillow==11.3.0",
  "pre-commit==4.2.0",
  "psycopg2-binary==2.9.10",
  "pydotplus==2.0.2",
  "python-dotenv==1.1.0",
  "python-magic-bin==0.4.14; sys_platform == 'win32'",
  "python-magic==0.4.27; sys_platform == 'linux'",
  "setuptools==80.9.0",
  "uvicorn==0.35.0",
  "whitenoise[brotli]==6.9.0",
  "django-cloudinary-storage==0.3.0",
]

[project.optional-dependencies]
cloudinary = [
  "django-cloudinary-storage==0.3.0",
  "cloudinary==1.44.0",
]

[dependency-groups]
dev = [
  "pylint==3.3.7",
  "ipython==9.4.0",
  "ruff==0.12.7",
]

[tool.pdm.scripts]
pre_dev = "python ./scripts/set_my_ip.py"
dev = "python manage.py runserver 127.0.0.1:8000"

createsuperuser = "python manage.py createsuperuser"

pre_migrate = "python manage.py makemigrations"
migrate = "python manage.py migrate"

diagram = "python manage.py graph_models -S -g -o core.png core"

shell = "python manage.py shell"
shellp = "python manage.py shell_plus"

test = "python manage.py test"

loaddata = "python manage.py loaddata core.json"
dumpdata = "python manage.py dumpdata --indent 2"

cria_api = "python ./scripts/cria_api.py {args}"

check = "ruff check"
pre_format = "ruff check --fix"
format = "ruff format"

[tool.pdm]
distribution = false

[tool.ruff]
line-length = 120
extend-exclude = ["migrations", "__init__.py", "manage.py"]

[tool.ruff.lint]
preview = true
select = ["I", "F", "E", "W", "PL", "PT"]
ignore = ["PLR6301"]

[tool.ruff.format]
preview = true
quote-style = "single"