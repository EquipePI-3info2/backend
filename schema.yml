          title: Sabor
          description: Sabor principal do produto. Deixe em branco se não se aplica.
        category:
          type: integer
          title: Categoria
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
