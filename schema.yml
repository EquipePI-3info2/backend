        is_staff:
          type: boolean
          readOnly: true
          title: Equipe
          description: Indica que este usuário pode acessar o painel admin.
        profile_photo_url:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Criado em
    PatchedUserUpdate:
