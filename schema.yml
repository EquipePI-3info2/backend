openapi: 3.0.3
info:
  title: Brookiê API
  version: 1.0.0
  description: API do e-commerce Brookiê — cookies e brownies artesanais.
paths:
  /api/categories/:
    get:
      operationId: categories_list
      description: |-
        GET    /api/categories/                  → lista (público)
        GET    /api/categories/{slug}/           → detalhe (público)
        GET    /api/categories/{slug}/products/  → produtos da categoria (público)
        POST   /api/categories/                  → criar (admin)
        PATCH  /api/categories/{slug}/           → editar (admin)
        DELETE /api/categories/{slug}/           → remover (admin)
      summary: Listar categorias
      parameters:
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      tags:
      - categories
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryList'
          description: ''
    post:
      operationId: categories_create
      description: |-
        GET    /api/categories/                  → lista (público)
        GET    /api/categories/{slug}/           → detalhe (público)
        GET    /api/categories/{slug}/products/  → produtos da categoria (público)
        POST   /api/categories/                  → criar (admin)
        PATCH  /api/categories/{slug}/           → editar (admin)
        DELETE /api/categories/{slug}/           → remover (admin)
      summary: Criar categoria [admin]
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryWrite'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryWrite'
          description: ''
  /api/categories/{slug}/:
    get:
      operationId: categories_retrieve
      description: |-
        GET    /api/categories/                  → lista (público)
        GET    /api/categories/{slug}/           → detalhe (público)
        GET    /api/categories/{slug}/products/  → produtos da categoria (público)
        POST   /api/categories/                  → criar (admin)
        PATCH  /api/categories/{slug}/           → editar (admin)
        DELETE /api/categories/{slug}/           → remover (admin)
      summary: Detalhe da categoria
      parameters:
      - in: path
        name: slug
        schema:
          type: string
          description: Gerado automaticamente. Usado em URLs e no filtro ?category=slug
            da API.
        required: true
      tags:
      - categories
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    patch:
      operationId: categories_partial_update
      description: |-
        GET    /api/categories/                  → lista (público)
        GET    /api/categories/{slug}/           → detalhe (público)
        GET    /api/categories/{slug}/products/  → produtos da categoria (público)
        POST   /api/categories/                  → criar (admin)
        PATCH  /api/categories/{slug}/           → editar (admin)
        DELETE /api/categories/{slug}/           → remover (admin)
      summary: Editar categoria [admin]
      parameters:
      - in: path
        name: slug
        schema:
          type: string
          description: Gerado automaticamente. Usado em URLs e no filtro ?category=slug
            da API.
        required: true
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategoryWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategoryWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategoryWrite'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryWrite'
          description: ''
    delete:
      operationId: categories_destroy
      description: |-
        GET    /api/categories/                  → lista (público)
        GET    /api/categories/{slug}/           → detalhe (público)
        GET    /api/categories/{slug}/products/  → produtos da categoria (público)
        POST   /api/categories/                  → criar (admin)
        PATCH  /api/categories/{slug}/           → editar (admin)
        DELETE /api/categories/{slug}/           → remover (admin)
      summary: Remover categoria [admin]
      parameters:
      - in: path
        name: slug
        schema:
          type: string
          description: Gerado automaticamente. Usado em URLs e no filtro ?category=slug
            da API.
        required: true
      tags:
      - categories
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/categories/{slug}/products/:
    get:
      operationId: categories_products_retrieve
      description: GET /api/categories/{slug}/products/
      summary: Produtos desta categoria
      parameters:
      - in: path
        name: slug
        schema:
          type: string
          description: Gerado automaticamente. Usado em URLs e no filtro ?category=slug
            da API.
        required: true
      tags:
      - categories
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/orders/:
    get:
      operationId: orders_list
      description: |-
        CRUD de pedidos.

        Administradores:
            - possuem acesso a todos os pedidos.

        Usuários comuns:
            - visualizam apenas os próprios pedidos.
      summary: Listar pedidos
      parameters:
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      tags:
      - orders
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderList'
          description: ''
    post:
      operationId: orders_create
      description: |-
        CRUD de pedidos.

        Administradores:
            - possuem acesso a todos os pedidos.

        Usuários comuns:
            - visualizam apenas os próprios pedidos.
      summary: Criar pedido
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrderCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreate'
          description: ''
  /api/orders/{id}/:
    get:
      operationId: orders_retrieve
      description: |-
        CRUD de pedidos.

        Administradores:
            - possuem acesso a todos os pedidos.

        Usuários comuns:
            - visualizam apenas os próprios pedidos.
      summary: Detalhes do pedido
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este Pedido.
        required: true
      tags:
      - orders
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
    patch:
      operationId: orders_partial_update
      description: |-
        CRUD de pedidos.

        Administradores:
            - possuem acesso a todos os pedidos.

        Usuários comuns:
            - visualizam apenas os próprios pedidos.
      summary: Atualizar pedido
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este Pedido.
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOrderUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOrderUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOrderUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderUpdate'
          description: ''
    delete:
      operationId: orders_destroy
      description: |-
        CRUD de pedidos.

        Administradores:
            - possuem acesso a todos os pedidos.

        Usuários comuns:
            - visualizam apenas os próprios pedidos.
      summary: Excluir pedido
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este Pedido.
        required: true
      tags:
      - orders
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/orders/latest/:
    get:
      operationId: orders_latest_retrieve
      description: |-
        CRUD de pedidos.

        Administradores:
            - possuem acesso a todos os pedidos.

        Usuários comuns:
            - visualizam apenas os próprios pedidos.
      summary: Último pedido do usuário
      tags:
      - orders
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/orders/me/:
    get:
      operationId: orders_me_retrieve
      description: |-
        CRUD de pedidos.

        Administradores:
            - possuem acesso a todos os pedidos.

        Usuários comuns:
            - visualizam apenas os próprios pedidos.
      summary: Pedidos do usuário autenticado
      tags:
      - orders
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/products/:
    get:
      operationId: products_list
      summary: Listar produtos
      parameters:
      - in: query
        name: category
        schema:
          type: string
      - in: query
        name: in_stock
        schema:
          type: boolean
      - in: query
        name: is_featured
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      - in: query
        name: price_max
        schema:
          type: number
      - in: query
        name: price_min
        schema:
          type: number
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      tags:
      - products
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'
          description: ''
    post:
      operationId: products_create
      summary: Criar produto [admin]
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProductWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProductWrite'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductWrite'
          description: ''
  /api/products/{slug}/:
    get:
      operationId: products_retrieve
      summary: Detalhe do produto
      parameters:
      - in: path
        name: slug
        schema:
          type: string
          description: Gerado automaticamente. Usado em URLs como /produto/cookie-classico/
        required: true
      tags:
      - products
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          description: ''
    patch:
      operationId: products_partial_update
      summary: Editar produto [admin]
      parameters:
      - in: path
        name: slug
        schema:
          type: string
          description: Gerado automaticamente. Usado em URLs como /produto/cookie-classico/
        required: true
      tags:
      - products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProductWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProductWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProductWrite'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductWrite'
          description: ''
    delete:
      operationId: products_destroy
      summary: Remover produto [admin]
      parameters:
      - in: path
        name: slug
        schema:
          type: string
          description: Gerado automaticamente. Usado em URLs como /produto/cookie-classico/
        required: true
      tags:
      - products
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/registro/:
    post:
      operationId: registro_create
      description: Endpoint para registro de novos usuários.
      tags:
      - registro
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistration'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistration'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegistration'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/token/:
    post:
      operationId: token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/token/refresh/:
    post:
      operationId: token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/token/verify/:
    post:
      operationId: token_verify_create
      description: |-
        Takes a token and indicates if it is valid.  This view provides no
        information about a token's fitness for a particular use.
      tags:
      - token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerify'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenVerify'
          description: ''
  /api/usuarios/:
    get:
      operationId: usuarios_list
      description: |-
        CRUD de usuários.

        - Administradores têm acesso a todos os usuários.
        - Usuários comuns só conseguem acessar o próprio registro.
        - Criação por este endpoint é restrita a administradores.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a serem retornados por página.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      tags:
      - usuarios
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserList'
          description: ''
    post:
      operationId: usuarios_create
      description: |-
        CRUD de usuários.

        - Administradores têm acesso a todos os usuários.
        - Usuários comuns só conseguem acessar o próprio registro.
        - Criação por este endpoint é restrita a administradores.
      tags:
      - usuarios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/usuarios/{id}/:
    get:
      operationId: usuarios_retrieve
      description: |-
        CRUD de usuários.

        - Administradores têm acesso a todos os usuários.
        - Usuários comuns só conseguem acessar o próprio registro.
