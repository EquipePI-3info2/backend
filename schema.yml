      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este Usuário.
        required: true
      tags:
      - usuarios
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: usuarios_update
      description: |-
        CRUD de usuários.

        - Administradores têm acesso a todos os usuários.
        - Usuários comuns só conseguem acessar o próprio registro.
        - Criação por este endpoint é restrita a administradores.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este Usuário.
        required: true
      tags:
      - usuarios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: usuarios_partial_update
      description: |-
        CRUD de usuários.

        - Administradores têm acesso a todos os usuários.
        - Usuários comuns só conseguem acessar o próprio registro.
        - Criação por este endpoint é restrita a administradores.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este Usuário.
        required: true
      tags:
      - usuarios
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    delete:
      operationId: usuarios_destroy
      description: |-
        CRUD de usuários.

        - Administradores têm acesso a todos os usuários.
        - Usuários comuns só conseguem acessar o próprio registro.
        - Criação por este endpoint é restrita a administradores.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este Usuário.
        required: true
      tags:
      - usuarios
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/usuarios/me/:
    get:
      operationId: usuarios_me_retrieve
      description: Retorna os dados do usuário autenticado.
      summary: Dados do usuário autenticado
      tags:
      - usuarios
      security:
      - jwtAuth: []
      responses:
        '200':
