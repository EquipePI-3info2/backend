          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfilePhoto'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
    delete:
      operationId: usuarios_me_foto_destroy
      description: Remove a foto de perfil do usuário autenticado.
      summary: Remover foto de perfil
      tags:
      - usuarios
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '401':
          description: No response body
components:
  schemas:
    Category:
      type: object
      description: Serializer público — usado na vitrine e na Home.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Nome
          maxLength: 150
        slug:
          type: string
          readOnly: true
          description: Gerado automaticamente. Usado em URLs e no filtro ?category=slug
            da API.
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          title: Descrição
        image_url:
          type: string
          nullable: true
          readOnly: true
        is_active:
          type: boolean
          title: Ativo
          description: Categorias inativas ficam ocultas na vitrine sem serem excluídas.
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: Ordem de exibição
          description: Menor número = aparece primeiro. Controla a sequência das pills
            na Home.
        product_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Criado em
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Atualizado em
      required:
      - created_at
      - id
      - image_url
      - name
      - product_count
      - slug
      - updated_at
    CategoryWrite:
      type: object
      description: Serializer de escrita — somente para admin.
      properties:
        name:
          type: string
          title: Nome
          maxLength: 150
        description:
          type: string
          title: Descrição
        image:
          type: string
          format: uri
          nullable: true
          title: Imagem
        is_active:
          type: boolean
          title: Ativo
          description: Categorias inativas ficam ocultas na vitrine sem serem excluídas.
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: Ordem de exibição
          description: Menor número = aparece primeiro. Controla a sequência das pills
            na Home.
      required:
      - name
    Flavor:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Nome
          maxLength: 100
        slug:
          type: string
          description: Gerado automaticamente. Usado em filtros de API.
          maxLength: 120
          pattern: ^[-a-zA-Z0-9_]+$
      required:
      - id
      - name
    Order:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          readOnly: true
          title: Código do pedido
          description: 'Gerado automaticamente. Ex: BRK-A3F9K2.'
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        status_display:
          type: string
          readOnly: true
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          title: Desconto
        delivery_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
          title: Taxa de entrega
          description: Frete ou retirada.
        total:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        delivery_address:
          type: string
          readOnly: true
          title: Logradouro
        delivery_city:
          type: string
          readOnly: true
          title: Cidade
        delivery_state:
          type: string
          readOnly: true
          title: Estado
        delivery_zip:
          type: string
          readOnly: true
          title: CEP
        delivery_notes:
          type: string
          readOnly: true
          title: Observações
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Criado em
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Atualizado em
        confirmed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Confirmado em
        delivered_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Entregue em
        total_items:
          type: string
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
      required:
      - code
      - confirmed_at
      - created_at
      - delivered_at
      - delivery_address
      - delivery_city
      - delivery_fee
      - delivery_notes
      - delivery_state
      - delivery_zip
      - discount
      - id
      - items
      - status
      - status_display
      - subtotal
      - total
      - total_items
      - updated_at
    OrderCreate:
      type: object
      properties:
        delivery_address:
          type: string
          title: Logradouro
          maxLength: 300
        delivery_city:
          type: string
          title: Cidade
          maxLength: 100
        delivery_state:
          type: string
          title: Estado
          maxLength: 2
        delivery_zip:
          type: string
          title: CEP
          maxLength: 9
        delivery_notes:
          type: string
          title: Observações
        delivery_fee:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          title: Taxa de entrega
          description: Frete ou retirada.
        discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Desconto
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemCreate'
          writeOnly: true
      required:
      - items
    OrderItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          type: integer
          readOnly: true
          title: Produto
        product_name:
          type: string
          readOnly: true
        product_slug:
          type: string
          readOnly: true
        product_image:
          type: string
          format: uri
          readOnly: true
        category:
          type: string
          readOnly: true
        flavor:
          type: string
          readOnly: true
          nullable: true
        quantity:
          type: integer
          readOnly: true
          title: Quantidade
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
          title: Preço unitário
          description: Salvo no momento da compra. Não sofre alterações retroativas.
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
      required:
      - category
      - flavor
      - id
      - product
      - product_image
      - product_name
      - product_slug
      - quantity
      - subtotal
      - unit_price
    OrderItemCreate:
      type: object
